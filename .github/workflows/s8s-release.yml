name: "s8s: Webmail release"

# The Lite static bundle that s8s-mail serves under /webmail, attached to a
# GitHub release. Cut one by pushing a tag `<upstream version>-s8s.<n>` from
# main:
#
#   git tag 1.17.2-s8s.1 && git push origin 1.17.2-s8s.1
#
# The zip is the same for every s8s-mail deployment: config.json ships without
# a JMAP server URL, and the s8s-mail Worker serves the real one.
#
# The release is created with GITHUB_TOKEN, so it does not trigger the upstream
# release workflows (static-lite.yml would attach its generic zips).

on:
  push:
    tags: ["*-s8s.*"]
  pull_request:
    paths: [".github/workflows/s8s-release.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # All locales: s8s-mail decides how /webmail/* is routed.
      - name: Build static export
        env:
          CI: "true"
          GIT_COMMIT: ${{ github.sha }}
          LITE_TARGET: static
          NEXT_PUBLIC_BASE_PATH: /webmail
        run: npm run build:lite

      - name: Package zip
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="$REF_NAME"
          else
            VERSION="$(cat VERSION)-${GITHUB_SHA::7}"
          fi
          ZIP="s8s-webmail-${VERSION}.zip"
          (cd out && zip -qr "../${ZIP}" .)
          echo "ZIP=${ZIP}" >> "$GITHUB_ENV"
          ls -la "${ZIP}"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: s8s-webmail
          path: ${{ env.ZIP }}
          retention-days: 7

  release:
    name: Create release
    # The only job with a write token, and it runs no checked-out code.
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download zip
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: s8s-webmail
          path: zips

      - name: Checksum zip
        working-directory: zips
        run: for zip in *.zip; do sha256sum "$zip" > "$zip.sha256"; done

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: zips/*.zip

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          UPSTREAM="${TAG%-s8s.*}"
          gh release create "$TAG" zips/*.zip zips/*.zip.sha256 \
            --verify-tag --latest --title "$TAG" \
            --notes "Bulwark Lite ${UPSTREAM} with the s8s-mail patches, built for the \`/webmail\` base path. Upstream release: https://github.com/bulwarkmail/webmail/releases/tag/${UPSTREAM}"
